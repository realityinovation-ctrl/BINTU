# BINTU — conf douce (garde le bind local 8092 du VPS)
# Le HTTPS public reste géré par le reverse proxy / panneau existant → 8092.
# Ici : uniquement proxy → Uvicorn :8000 + WebSocket Live.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # STRICTEMENT comme avant : port local, pas d'écoute publique
    listen 127.0.0.1:8092;
    server_name bintu.realityinnovation.fr;

    client_max_body_size 50M;

    location / {
        # Sans slash final → préserve /api/live
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # map : "upgrade" si WS, sinon "close" (plus sûr que Connection fixe)
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
